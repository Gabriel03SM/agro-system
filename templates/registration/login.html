{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="card login">
  <h1>🌾 {{ NOME_LOJA }}</h1>
  <p class="mudo">Entre para acessar o sistema.</p>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<div class="erro">Usuário ou senha incorretos.</div>{% endif %}
    <div class="campo"><label for="id_username">Usuário</label>{{ form.username }}</div>
    <div class="campo"><label for="id_password">Senha</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primario" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
