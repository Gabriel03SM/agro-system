{% if page.paginator.num_pages > 1 %}
<div class="paginacao">
  {% if page.has_previous %}<a class="btn" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.previous_page_number }}">← Anterior</a>{% endif %}
  <span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.next_page_number }}">Próxima →</a>{% endif %}
</div>
{% endif %}
