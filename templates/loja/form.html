{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<header class="cabeca"><h1>{{ titulo }}</h1><a class="link-voltar" href="{% url voltar %}">{% include "loja/_icone.html" with nome="voltar" %}Voltar</a></header>
<section class="card estreito formulario-pagina">
  <form method="post" novalidate>{% csrf_token %}
    {% include "loja/_campos.html" %}
    <div class="acoes acoes-formulario"><button class="btn primario" type="submit">Salvar</button><a class="btn" href="{% url voltar %}">Cancelar</a></div>
  </form>
</section>
{% endblock %}
