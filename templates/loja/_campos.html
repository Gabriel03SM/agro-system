{% if form.non_field_errors %}<div class="erro">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form.visible_fields %}
<div class="campo">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  {% for e in field.errors %}<small class="msg-erro">{{ e }}</small>{% endfor %}
</div>
{% endfor %}
