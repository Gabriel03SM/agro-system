services:
  - type: web
    name: agro-gestao
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: PUBLIC_BASE_URL
        value: https://agro-gestao.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: NOME_LOJA
        value: Agropecuária
      - key: DATABASE_URL        # cole a string do Supabase (Session pooler) no painel do Render
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
